<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e2a3;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#9e7526;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a3f10;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="60%" y2="60%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Main arrow pointer body -->
  <polygon 
    points="2,2 2,22 8,17 12,26 15,25 11,16 18,16"
    fill="url(#goldGrad)"
    filter="url(#shadow)"
  />
  <!-- Shine overlay -->
  <polygon 
    points="2,2 2,14 10,10"
    fill="url(#goldShine)"
    opacity="0.7"
  />
  <!-- Inner edge detail -->
  <polygon 
    points="2,2 2,22 8,17 12,26 15,25 11,16 18,16"
    fill="none"
    stroke="#f5e2a3"
    stroke-width="0.5"
    opacity="0.5"
  />
</svg>
