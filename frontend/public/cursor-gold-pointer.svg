<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e2a3;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#9e7526;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a3f10;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Hand pointer shape -->
  <g filter="url(#shadow)">
    <!-- index finger pointing up -->
    <rect x="13" y="5" width="5" height="14" rx="2.5" fill="url(#goldGrad)"/>
    <!-- middle finger -->
    <rect x="19" y="9" width="4.5" height="10" rx="2.25" fill="url(#goldGrad)"/>
    <!-- ring finger -->
    <rect x="24" y="10" width="4" height="9" rx="2" fill="url(#goldGrad)"/>
    <!-- pinky -->
    <!-- thumb side -->
    <rect x="8" y="10" width="4.5" height="9" rx="2.25" fill="url(#goldGrad)"/>
    <!-- palm base -->
    <rect x="8" y="17" width="20" height="9" rx="3" fill="url(#goldGrad)"/>
    <!-- shine -->
    <rect x="13" y="5" width="2" height="8" rx="1" fill="#fff8dc" opacity="0.5"/>
  </g>
</svg>
